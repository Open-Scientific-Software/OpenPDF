[package]
name = "openpdf-engine"
description = "OpenPDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
openpdf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
openpdf-render = { workspace = true }
openpdf-cos = { workspace = true }
openpdf-organize = { workspace = true }
openpdf-annot = { workspace = true }
openpdf-forms = { workspace = true }
openpdf-xfa = { workspace = true }
openpdf-edit = { workspace = true }
openpdf-content = { workspace = true }
openpdf-audit = { workspace = true }
openpdf-redact = { workspace = true }
openpdf-print = { workspace = true }
openpdf-xfdf = { workspace = true }
openpdf-sign = { workspace = true }
openpdf-optimize = { workspace = true }
openpdf-a11y = { workspace = true }
openpdf-ocr = { workspace = true }
openpdf-js = { workspace = true }
openpdf-compare = { workspace = true }
openpdf-preflight = { workspace = true }
openpdf-export = { workspace = true }
openpdf-fonts = { workspace = true }
openpdf-create = { workspace = true }
openpdf-model = { workspace = true }
openpdf-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and openpdf-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
openpdf-testkit = { workspace = true }
# JBIG2 fixtures (`encode_jbig2_generic`).
openpdf-filters = { workspace = true }
