[package]
name = "openpdf-automation"
description = "Agent control for OpenPDF: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
openpdf-engine = { workspace = true }
openpdf-cos = { workspace = true }
openpdf-render = { workspace = true }
openpdf-organize = { workspace = true }
openpdf-platform = { workspace = true }
craft-prc = { workspace = true }
openpdf-prc-render = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
base64 = { version = "0.23", optional = true }
craft-jsonrpc = { workspace = true, optional = true }
craft-mcp-server = { workspace = true, optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64", "dep:craft-jsonrpc", "dep:craft-mcp-server"]

[dev-dependencies]
# Synthetic printer profiles for the app-managed print colour tests.
craft-cms = { workspace = true }
craft-image-codecs = { workspace = true }
# Word exports read back as Word reads them.
craft-docx = { workspace = true }
craft-wordmodel = { workspace = true }
openpdf-fonts = { workspace = true }
flate2.workspace = true
openpdf-model = { workspace = true }
openpdf-xfa = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
