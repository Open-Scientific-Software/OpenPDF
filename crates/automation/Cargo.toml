[package]
name = "openpdf-automation"
description = "Agent control for OpenPDF: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
openpdf-engine = { workspace = true }
openpdf-cos = { workspace = true }
openpdf-render = { workspace = true }
openpdf-organize = { workspace = true }
openpdf-platform = { workspace = true }
openpdf-prc = { workspace = true }
openpdf-prc-render = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
base64 = { version = "0.23", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
openpdf-fonts = { workspace = true }
png = "0.18"
flate2.workspace = true
openpdf-model = { workspace = true }
openpdf-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
